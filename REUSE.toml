version = 1

[[annotations]]
path = ["**/*_bpfel.go", "**/*_bpfel.o"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 waldh4ri"
SPDX-License-Identifier = "GPL-2.0-only OR BSD-2-Clause"
# Generated by bpf2go from the .bpf.c sources next to them.

[[annotations]]
path = ["bpf/include/x86/vmlinux.h", "bpf/include/arm64/vmlinux.h"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Linux kernel contributors"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = ["bpf/include/bpf_helper_defs.h"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2015 The Libbpf Authors"
SPDX-License-Identifier = "LGPL-2.1-only OR BSD-2-Clause"

[[annotations]]
path = [
  "bpf/include/bpf_core_read.h",
  "bpf/include/bpf_endian.h",
  "bpf/include/bpf_helpers.h",
  "bpf/include/bpf_tracing.h",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2015 The Libbpf Authors"
SPDX-License-Identifier = "LGPL-2.1-only OR BSD-2-Clause"

[[annotations]]
path = [
  "go.mod", "go.sum", "Makefile", "README.md", "docs/**", "REUSE.toml",
  "THIRD_PARTY_LICENSES", ".gitattributes", ".gitignore", ".golangci.yml",
  ".github/**", "build/**", "test/vm/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 waldh4ri"
SPDX-License-Identifier = "GPL-2.0-only OR BSD-2-Clause"

# The eBPF sources are not given a copyright line in the file: inserting lines
# shifts the BTF line info embedded in the committed *_bpfel.o objects. The
# .bpf.c files carry their own SPDX tag; zygarde.h takes its license from here.
[[annotations]]
path = ["**/*.bpf.c", "bpf/include/zygarde.h"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 waldh4ri"
SPDX-License-Identifier = "GPL-2.0-only OR BSD-2-Clause"
