name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Regenerate with the pinned toolchain image: other clang versions
      # produce different (equally valid) bytecode.
      - name: Check generated BPF bindings are up to date
        run: |
          make docker-generate
          git diff --exit-code -- cells/ internal/
      # fmt, go mod tidy, vet on amd64 and arm64, golangci-lint, govulncheck and
      # go test -race; the same `make check` runs locally.
      - run: make check
      - run: make dist
      - name: Smoke test on the runner's kernel
        # Exit 1 means a Cell failed to run; 0 and 2 are valid outcomes.
        run: sudo ./dist/zygarde-linux-amd64 || [ $? -ne 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: zygarde
          path: dist/

  # Boots each upstream LTS kernel from ghcr.io/cilium/ci-kernels and runs
  # zygarde in it (test/vm/upstream.sh). Fails on any ERROR, SUSPICIOUS
  # result or missed canary.
  kernels:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: zygarde
          path: dist/
      - run: install -m 755 dist/zygarde-linux-amd64 zygarde
      - name: Install QEMU and vimto
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86
          sudo chmod 0666 /dev/kvm
          make install-vimto
      - run: bash test/vm/upstream.sh
      # Also in the log: the step summary is hard to reach when a run fails.
      - run: go run ./test/vm/report test/vm/out | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
